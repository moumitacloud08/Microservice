server:
  port: 8080
spring:
  application:
    name: "accounts"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import: "optional:configserver:http://localhost:8071/"
  http:
    serviceclient:
      loans:
        base-url: lb://loans  #Load Balancer
      cards:
        base-url: lb://cards

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted # To access the shutdown URL without any restriction
  info:
    env:
      enabled: true # Tell actuator to start exposing the info related properties defined below

eureka:
  instance:
    preferIpAddress: true # Register with IP address as in local there is no DNS setup
  client:
    fetchRegistry: true # accounts fetches registry details when it needs to talk to other microservices
    registerWithEureka: true # to register itself with Eureka server
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "accounts"
    description: "Eazy Bank Accounts Application"
    version: "1.0.0"

logging:
  pattern:
    console:  ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}

