
spring:
  application:
    name: "configserver"
  profiles:
    #active: native  # To load properties from classpath or file system under cloud/config/server
    active: git      #To load properties from git under cloud/config/server
  cloud:
    config:
      server:
        #native:
          #search-locations: "classpath:/config" #store the properties files in classpath (resource folder)
          #search-locations: "file:///C:/Users/moumi/OneDrive/Documents/config" #store the properties files in file system
        git:
          uri: "https://github.com/moumitacloud08/Microservice.git"   #From the author https://github.com/eazybytes/eazybytes-config.git
          default-label: main
          search-paths: configuration/eazybytes-config # Not required for author's git repo link
          timeout: 5
          clone-on-start: true
          force-pull: true
server:
  port: 8071

logging:
  pattern:
    console:  ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}
